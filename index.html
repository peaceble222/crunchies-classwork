<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crunchies - Taste the Difference</title>
    <link rel="icon" href="images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Navigation Header -->
    <header class="navbar">
      <div class="nav-left">
        <a href="#home" class="logo" aria-label="Crunchies home">
          <img
            class="logo-image"
            src="images/crunchies-logo.png"
            alt="Crunchies"
            width="78"
            height="54"
          />
        </a>
      </div>

      <nav class="nav-links" id="primary-navigation" aria-label="Main navigation">
        <div class="nav-items">
          <a href="#home" class="active" aria-current="page">Home</a>
          <a href="#menu">Menu</a>
          <a href="#account">My Account</a>
          <a href="#support">Support</a>
        </div>
        <button class="location-btn" type="button">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#e31c24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span>Set Location</span>
        </button>
      </nav>

      <div class="nav-right">
        <button class="cart-btn" type="button" aria-label="Shopping Cart">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#e31c24"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path
              d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
            ></path>
          </svg>
        </button>
        <button
          class="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="primary-navigation"
        >
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>
    </header>

    <!-- Hero Section -->
    <main class="hero" id="home">
      <section class="hero-content" aria-labelledby="hero-title">
        <p class="welcome-text">Welcome to CRUNCHIES!</p>
        <h1 class="hero-title" id="hero-title">Taste the<br />Difference...</h1>
        <p class="order-prompt">How would you like to receive your order?</p>

        <div class="order-options">
          <button
            class="option-card"
            type="button"
            data-order-mode="Delivery"
            aria-pressed="false"
          >
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="1" y="3" width="15" height="13"></rect>
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
              <circle cx="5.5" cy="18.5" r="2.5"></circle>
              <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <span>DELIVERY</span>
          </button>

          <button
            class="option-card option-card-secondary"
            type="button"
            data-order-mode="Pickup"
            aria-pressed="false"
          >
            <svg
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
              ></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span>PICKUP</span>
          </button>
        </div>
        <p class="order-feedback" aria-live="polite" hidden></p>
      </section>
      <figure class="hero-image-container">
        <img
          class="hero-img"
          src="images/crunchies-cutout.png"
          alt="Woman in an orange outfit and dark sunglasses enjoying popcorn"
          width="1200"
          height="1383"
          fetchpriority="high"
        />
      </figure>
      <button class="loyalty-btn" type="button">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M16 8l-8 8"></path>
          <circle cx="9" cy="9" r="1" fill="currentColor"></circle>
          <circle cx="15" cy="15" r="1" fill="currentColor"></circle>
        </svg>
        <span>Earn Loyalty Points</span>
      </button>
    </main>
  </body>
</html>
